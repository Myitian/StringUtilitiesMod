plugins {
    id "com.gradleup.shadow" version "9.2.2"
}

project.version_id = "1.20.6"
version = "${project.mod_version}-forge-${project.version_id}"

architectury {
    platformSetupLoomIde()
    forge()
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common
}

shadow {
    addShadowVariantIntoJavaComponent = false
}

dependencies {
    minecraft "com.mojang:minecraft:1.20.6"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-1.20.6:2024.06.16@zip")
    }
    forge "net.minecraftforge:forge:1.20.6-50.2.4"
    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionForge")) { transitive = false }
}

processResources {
    def props = [
            mod_id                              : project.mod_id,
            mod_version                         : project.version,
            mod_name                            : project.mod_name,
            mod_description                     : project.mod_description,
            mod_license                         : project.mod_license,
            mod_author                          : project.mod_author,
            mod_source                          : project.mod_source,
            maven_group                         : project.maven_group,
            supported_minecraft_version_fabric  : project.supported_minecraft_version_fabric,
            supported_minecraft_version_forge   : project.supported_minecraft_version_forge,
            supported_minecraft_version_neoforge: project.supported_minecraft_version_neoforge,
    ]
    inputs.properties props

    filesMatching(["pack.mcmeta", "fabric.mod.json", "META-INF/*mods.toml"]) {
        expand props
    }
}

shadowJar {
    exclude("fabric.mod.json", "architectury.common.json", "*-refmap.json", "architectury_inject*/**")
    configurations = [project.configurations.shadowCommon]
    archiveClassifier = "dev-shadow"
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
}

sourcesJar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
    def forgeSources = project(":forge").sourcesJar
    dependsOn forgeSources
    from forgeSources.archiveFile.map { zipTree(it) }
}